[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godot-hpa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "posix-ipc",
    "numpy",
]

[project.optional-dependencies]
gymnasium = ["gymnasium"]
dev = [
    "godot-hpa[gymnasium]",
    "matplotlib",
    "pyqt5",
    "pandas",
    "opencv-python",
]
train = [
    "godot-hpa[gymnasium]",
    "torch",
    "tyro",
    "tensorboard",
]

[tool.hatch.build.targets.wheel]
packages = ["godot_hpa"]